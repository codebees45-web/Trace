server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively; never cache index.html itself
    # so deployments are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any unmatched route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend container. Strips the /api prefix, so
    # /api/predict -> http://backend:8000/predict. Matches VITE_API_URL=/api
    # baked into the frontend build (see Dockerfile / docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large uploads / slow SD inference — give predict requests room.
        client_max_body_size 12M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}