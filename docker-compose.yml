services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Frontend talks to the backend through nginx's /api proxy on the
      # same origin, so CORS only needs to allow that origin (or none, if
      # you're not calling the API directly from the browser on another
      # domain). Override ALLOWED_ORIGINS in backend/.env for your real domain.
      MONGODB_URI: mongodb://mongodb:27017
      # This compose file is the production deployment path — this enables
      # the strict startup checks in config.py (real JWT_SECRET required).
      ENVIRONMENT: production
    volumes:
      # Persist the cached files across container recreates.
      - trace-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 2g

  mongodb:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - trace-data:/data/db
    expose:
      - "27017"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trace-data:
  trace-backups: